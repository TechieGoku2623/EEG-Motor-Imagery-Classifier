name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        run: python -m compileall -q -f config.py data models
