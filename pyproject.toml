[project]
name = "eeg-motor-imagery-classifier"
version = "1.0.0"
description = "EEG motor imagery classification on PhysioNet EEGMMIDB (CSP vs EEGNet, within-subject and LOSO)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
  "eeg",
  "bci",
  "motor-imagery",
  "physionet",
  "mne",
  "pytorch",
  "eegnet",
  "csp",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "mne>=1.6",
  "wfdb>=4.1",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/TechieGoku2623/EEG-Motor-Imagery-Classifier"
Dataset = "https://physionet.org/content/eegmmidb/1.0.0/"
"Bug Tracker" = "https://github.com/TechieGoku2623/EEG-Motor-Imagery-Classifier/issues"
